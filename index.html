<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Shop Management System</title>
  <link rel="stylesheet" href="style.css" />
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
 
</head>
<body>

  <!-- LOGIN SCREEN -->
  <div id="login-screen" class="login-screen">
    <div class="login-blob login-blob-1"></div>
    <div class="login-blob login-blob-2"></div>
    <div class="login-card">
      <div class="login-logo">
        <div class="login-logo-icon"><i data-lucide="chef-hat"></i></div>
        <h1>Shop</h1>
        <p data-i18n="login.subtitle">Management System</p>
      </div>
      <form id="login-form" class="login-form">
        <label for="login-name" data-i18n="login.name">Your Name</label>
        <input type="text" id="login-name" required placeholder="Ahmed Ali" />
        <label data-i18n="login.role">Select Role</label>
        <div class="role-selector">
          <button type="button" class="role-btn" data-role="Owner">
            <i data-lucide="crown"></i><span data-i18n="role.owner">Admin</span>
          </button>
          <button type="button" class="role-btn" data-role="Staff">
            <i data-lucide="user-cog"></i><span data-i18n="role.staff">Staff</span>
          </button>
          <button type="button" class="role-btn" data-role="Cashier">
            <i data-lucide="wallet"></i><span data-i18n="role.cashier">Cashier</span>
          </button>
        </div>
        <button type="submit" class="btn btn-primary btn-block" data-i18n="login.enter">Enter System</button>
        <p class="login-note" data-i18n="login.note">Demo authentication only. Data is stored locally in your browser.</p>
      </form>
    </div>
  </div>

  <!-- APP SHELL -->
  <div id="app-shell" class="app-shell hidden">
    <!-- SIDEBAR -->
    <aside id="sidebar" class="sidebar">
      <div class="sidebar-brand">
        <div class="brand-icon"><i data-lucide="chef-hat"></i></div>
        <span class="brand-name">Kitchen Ware</span>
        <button id="sidebar-collapse" class="icon-btn sidebar-collapse"><i data-lucide="chevrons-left"></i></button>
      </div>
      <nav class="sidebar-nav" id="sidebar-nav">
        <a href="#" class="nav-item active" data-page="dashboard"><i data-lucide="layout-dashboard"></i><span data-i18n="nav.dashboard">Dashboard</span></a>
        <a href="#" class="nav-item" data-page="products"><i data-lucide="package"></i><span data-i18n="nav.products">Products</span></a>
        <a href="#" class="nav-item" data-page="inventory"><i data-lucide="warehouse"></i><span data-i18n="nav.inventory">Inventory</span></a>
        <a href="#" class="nav-item" data-page="pos"><i data-lucide="shopping-cart"></i><span data-i18n="nav.pos">Sales & POS</span></a>
        <a href="#" class="nav-item" data-page="payments"><i data-lucide="credit-card"></i><span data-i18n="nav.payments">Payments</span></a>
        <a href="#" class="nav-item" data-page="customers"><i data-lucide="users"></i><span data-i18n="nav.customers">Customers</span></a>
        <a href="#" class="nav-item" data-page="suppliers"><i data-lucide="truck"></i><span data-i18n="nav.suppliers">Suppliers</span></a>
        <a href="#" class="nav-item" data-page="expenses"><i data-lucide="receipt"></i><span data-i18n="nav.expenses">Expenses</span></a>
        <a href="#" class="nav-item" data-page="reports"><i data-lucide="bar-chart-3"></i><span data-i18n="nav.reports">Reports</span></a>
        <a href="#" class="nav-item" data-page="settings"><i data-lucide="settings"></i><span data-i18n="nav.settings">Settings</span></a>
        <a href="#" class="nav-item nav-logout" id="logout-btn"><i data-lucide="log-out"></i><span data-i18n="nav.logout">Logout</span></a>
      </nav>
    </aside>

    <!-- MAIN AREA -->
    <div class="main-area">
      <header class="topbar">
        <button id="mobile-menu" class="icon-btn mobile-menu"><i data-lucide="menu"></i></button>
        <div class="topbar-title">
          <h2 id="page-title">Dashboard</h2>
          <nav class="breadcrumb" id="breadcrumb">Home / Dashboard</nav>
        </div>
        <div class="topbar-actions">
          <div class="global-search">
            <i data-lucide="search"></i>
            <input type="text" id="global-search" placeholder="Search products..." data-i18n-placeholder="search.placeholder" />
          </div>
          <button class="icon-btn" id="notif-btn" title="Notifications"><i data-lucide="bell"></i><span class="notif-dot hidden" id="notif-dot"></span></button>
          <button class="icon-btn" id="theme-toggle" title="Toggle theme"><i data-lucide="moon"></i></button>
          <select id="lang-select" class="lang-select">
            <option value="en">EN</option>
            <option value="so">SO</option>
          </select>
          <div class="user-chip">
            <div class="avatar" id="user-avatar">A</div>
            <div class="user-info">
              <span id="user-name">Ahmed</span>
              <small id="user-role">Owner</small>
            </div>
          </div>
        </div>
      </header>

      <main id="main-content" class="main-content">
        <!-- PAGES INJECTED HERE -->
      </main>
    </div>
  </div>

  <!-- MOBILE DRAWER OVERLAY -->
  <div id="drawer-overlay" class="drawer-overlay hidden"></div>

  <!-- MODAL CONTAINER -->
  <div id="modal-container" class="modal-container hidden">
    <div class="modal-backdrop" id="modal-backdrop"></div>
    <div class="modal-box" id="modal-box"></div>
  </div>

  <!-- TOAST CONTAINER -->
  <div id="toast-container" class="toast-container"></div>

  <!-- PRINT RECEIPT -->
  <div id="receipt-print" class="receipt-print"></div>

  <script src="script.js"></script>
  
</body>
</html>
