<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kitchen Ware Management System</title>
  <link rel="stylesheet" href="style.css" />
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <style>
    :root {
  --green: #0cc44e;
  --green-dark: #09a841;
  --green-bright: #19e068;
  --green-text: #08a244;
  --btn-grad: linear-gradient(180deg, #17d35e 0%, #09a841 100%);
  --icon-grad: linear-gradient(135deg, #0a6b5a, #14a86a, #63e590);

  --blue: #3b82f6;
  --orange: #f59e0b;
  --purple: #8b5cf6;
  --red: #ef4444;
  --teal: #14b8a6;
  --pink: #ec4899;

  --sidebar: linear-gradient(180deg, #06182b 0%, #082640 100%);
  --hero: linear-gradient(135deg, #062a2a 0%, #07263d 100%);

  --bg: #f1f6fa;
  --card: #ffffff;
  --text: #0e2236;
  --muted: #6a7d90;
  --border: #e1e9f0;
}

body.dark {
  --bg: #040f1b;
  --card: #0a1c2f;
  --text: #f4f9ff;
  --muted: #8aa3b8;
  --border: #133450;
  --green-text: #2fe27a;
}

.login {
  --login-bg-from: #f8fcfa;
  --login-bg-to: #eef8f2;
  --login-title: #0a2540;
  --login-green: #0aa84a;
  --login-blob-from: #12b85a;
  --login-blob-to: #7be5a8;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

html, body {
  font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
  background: var(--bg);
  color: var(--text);
  font-size: 14px;
  transition: background 0.3s, color 0.3s;
}

.hidden { display: none !important; }

button { font-family: inherit; cursor: pointer; }
input, select, textarea { font-family: inherit; }

/* ===== LOGIN ===== */
.login-screen {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
  overflow: hidden;
  background: linear-gradient(160deg, var(--login-bg-from), var(--login-bg-to));
  padding: 24px;
}

.login-blob {
  position: absolute;
  border-radius: 50%;
  filter: blur(80px);
  opacity: 0.5;
  background: linear-gradient(135deg, var(--login-blob-from), var(--login-blob-to));
}
.login-blob-1 { width: 400px; height: 400px; top: -100px; left: -100px; }
.login-blob-2 { width: 350px; height: 350px; bottom: -120px; right: -80px; }

.login-card {
  position: relative;
  z-index: 2;
  width: 100%;
  max-width: 420px;
  background: rgba(255,255,255,0.92);
  backdrop-filter: blur(20px);
  border-radius: 20px;
  padding: 40px 32px;
  box-shadow: 0 24px 60px rgba(6, 24, 43, 0.18);
  border: 1px solid rgba(255,255,255,0.6);
}

.login-logo { text-align: center; margin-bottom: 28px; }
.login-logo-icon {
  width: 64px; height: 64px;
  margin: 0 auto 12px;
  border-radius: 18px;
  background: linear-gradient(135deg, #0a6b5a, #14a86a, #63e590);
  display: flex; align-items: center; justify-content: center;
  color: #fff;
  box-shadow: 0 8px 20px rgba(10, 168, 74, 0.35);
}
.login-logo-icon svg { width: 32px; height: 32px; }
.login-logo h1 { color: var(--login-title); font-size: 26px; font-weight: 800; letter-spacing: -0.5px; }
.login-logo p { color: var(--muted); font-size: 13px; margin-top: 4px; }

.login-form label {
  display: block;
  font-size: 12px;
  font-weight: 600;
  color: var(--login-title);
  margin: 16px 0 8px;
  text-transform: uppercase;
  letter-spacing: 0.5px;
}

.login-form input[type="text"] {
  width: 100%;
  padding: 12px 14px;
  border: 1.5px solid #d8e2ec;
  border-radius: 10px;
  font-size: 14px;
  outline: none;
  background: #fff;
  transition: border-color 0.2s, box-shadow 0.2s;
  color: #0e2236;
}
.login-form input[type="text"]:focus {
  border-color: var(--login-green);
  box-shadow: 0 0 0 3px rgba(10, 168, 74, 0.15);
}

.role-selector {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
  margin-bottom: 24px;
}
.role-btn {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
  padding: 14px 8px;
  border: 1.5px solid #d8e2ec;
  border-radius: 12px;
  background: #fff;
  color: #4a5f73;
  font-size: 12px;
  font-weight: 600;
  transition: all 0.2s;
}
.role-btn svg { width: 22px; height: 22px; }
.role-btn:hover { border-color: var(--login-green); color: var(--login-green); }
.role-btn.selected {
  background: linear-gradient(180deg, #17d35e, #09a841);
  border-color: transparent;
  color: #fff;
  box-shadow: 0 6px 16px rgba(10, 168, 74, 0.35);
}

.login-note {
  margin-top: 16px;
  font-size: 11px;
  text-align: center;
  color: var(--muted);
  line-height: 1.5;
}

/* ===== BUTTONS ===== */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  padding: 10px 18px;
  border-radius: 10px;
  font-size: 13px;
  font-weight: 600;
  border: none;
  transition: all 0.2s;
  white-space: nowrap;
}
.btn svg { width: 16px; height: 16px; }
.btn-primary { background: var(--btn-grad); color: #fff; box-shadow: 0 4px 12px rgba(10, 168, 74, 0.3); }
.btn-primary:hover { filter: brightness(1.06); transform: translateY(-1px); }
.btn-secondary { background: var(--bg); color: var(--text); border: 1px solid var(--border); }
.btn-secondary:hover { background: var(--border); }
.btn-danger { background: var(--red); color: #fff; }
.btn-danger:hover { filter: brightness(1.08); }
.btn-ghost { background: transparent; color: var(--muted); }
.btn-ghost:hover { background: var(--bg); color: var(--text); }
.btn-block { width: 100%; }
.btn-sm { padding: 6px 12px; font-size: 12px; }

.icon-btn {
  width: 38px; height: 38px;
  border-radius: 10px;
  border: 1px solid var(--border);
  background: var(--card);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  color: var(--muted);
  transition: all 0.2s;
  position: relative;
}
.icon-btn svg { width: 18px; height: 18px; }
.icon-btn:hover { color: var(--green-text); border-color: var(--green); }

/* ===== APP SHELL ===== */
.app-shell { display: flex; min-height: 100vh; }

.sidebar {
  width: 250px;
  flex-shrink: 0;
  background: var(--sidebar);
  color: #c9d6e3;
  display: flex;
  flex-direction: column;
  padding: 20px 14px;
  position: sticky;
  top: 0;
  height: 100vh;
  transition: width 0.25s ease, transform 0.25s ease;
  overflow-y: auto;
  z-index: 40;
}
.sidebar.collapsed { width: 78px; }
.sidebar.collapsed .brand-name,
.sidebar.collapsed .nav-item span,
.sidebar.collapsed .sidebar-collapse { display: none; }
.sidebar.collapsed .nav-item { justify-content: center; }
.sidebar.collapsed .sidebar-brand { justify-content: center; }

.sidebar-brand {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 6px 6px 20px;
  border-bottom: 1px solid rgba(255,255,255,0.08);
  margin-bottom: 16px;
}
.brand-icon {
  width: 38px; height: 38px;
  border-radius: 10px;
  background: linear-gradient(135deg, #0a6b5a, #14a86a, #63e590);
  display: flex; align-items: center; justify-content: center;
  color: #fff;
  flex-shrink: 0;
}
.brand-icon svg { width: 20px; height: 20px; }
.brand-name { font-weight: 700; font-size: 15px; color: #fff; white-space: nowrap; }
.sidebar-collapse {
  margin-left: auto;
  background: rgba(255,255,255,0.06);
  border-color: transparent;
  color: #c9d6e3;
  width: 30px; height: 30px;
}
.sidebar-collapse svg { width: 16px; height: 16px; }

.sidebar-nav { display: flex; flex-direction: column; gap: 4px; flex: 1; }
.nav-item {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 11px 12px;
  border-radius: 9px;
  color: #a7b9c9;
  text-decoration: none;
  font-size: 13.5px;
  font-weight: 500;
  transition: all 0.18s;
  white-space: nowrap;
}
.nav-item svg { width: 18px; height: 18px; flex-shrink: 0; }
.nav-item:hover { background: rgba(255,255,255,0.06); color: #fff; }
.nav-item.active {
  background: var(--btn-grad);
  color: #fff;
  box-shadow: 0 4px 12px rgba(10,168,74,0.3);
}
.nav-logout { margin-top: auto; color: #ff8a8a; }
.nav-logout:hover { background: rgba(239,68,68,0.15); color: #ffb3b3; }

.main-area { flex: 1; display: flex; flex-direction: column; min-width: 0; }

/* ===== TOPBAR ===== */
.topbar {
  display: flex;
  align-items: center;
  gap: 16px;
  padding: 14px 24px;
  background: var(--card);
  border-bottom: 1px solid var(--border);
  position: sticky;
  top: 0;
  z-index: 30;
}
.topbar-title h2 { font-size: 18px; font-weight: 700; color: var(--text); }
.breadcrumb { font-size: 12px; color: var(--muted); margin-top: 2px; }
.topbar-actions { margin-left: auto; display: flex; align-items: center; gap: 10px; }

.global-search {
  display: flex;
  align-items: center;
  gap: 8px;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 0 12px;
  height: 38px;
  width: 240px;
}
.global-search svg { width: 16px; height: 16px; color: var(--muted); flex-shrink: 0; }
.global-search input {
  border: none;
  background: transparent;
  outline: none;
  font-size: 13px;
  color: var(--text);
  width: 100%;
}

.notif-dot {
  position: absolute;
  top: 8px; right: 8px;
  width: 8px; height: 8px;
  background: var(--red);
  border-radius: 50%;
  border: 2px solid var(--card);
}

.lang-select {
  height: 38px;
  padding: 0 10px;
  border-radius: 10px;
  border: 1px solid var(--border);
  background: var(--card);
  color: var(--text);
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  outline: none;
}

.user-chip {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 4px 10px 4px 4px;
  border-radius: 40px;
  background: var(--bg);
  border: 1px solid var(--border);
}
.avatar {
  width: 32px; height: 32px;
  border-radius: 50%;
  background: var(--icon-grad);
  color: #fff;
  display: flex; align-items: center; justify-content: center;
  font-weight: 700;
  font-size: 13px;
}
.user-info { display: flex; flex-direction: column; line-height: 1.2; }
.user-info span { font-size: 13px; font-weight: 600; color: var(--text); }
.user-info small { font-size: 11px; color: var(--muted); }

.mobile-menu { display: none; }

/* ===== MAIN CONTENT ===== */
.main-content { padding: 24px; flex: 1; }

.page-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  margin-bottom: 20px;
  flex-wrap: wrap;
}
.page-header h3 { font-size: 20px; font-weight: 700; }
.page-header .page-sub { font-size: 13px; color: var(--muted); margin-top: 3px; }
.page-actions { display: flex; gap: 10px; flex-wrap: wrap; }

/* ===== CARDS ===== */
.card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 20px;
  box-shadow: 0 1px 3px rgba(6,24,43,0.04);
}

.stats-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
  gap: 16px;
  margin-bottom: 22px;
}
.stat-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 18px;
  display: flex;
  align-items: center;
  gap: 14px;
  transition: transform 0.2s, box-shadow 0.2s;
}
.stat-card:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(6,24,43,0.06); }
.stat-icon {
  width: 48px; height: 48px;
  border-radius: 12px;
  display: flex; align-items: center; justify-content: center;
  color: #fff;
  flex-shrink: 0;
}
.stat-icon svg { width: 22px; height: 22px; }
.stat-icon.green { background: linear-gradient(135deg, #0a6b5a, #14a86a); }
.stat-icon.blue { background: linear-gradient(135deg, #2563eb, #3b82f6); }
.stat-icon.orange { background: linear-gradient(135deg, #d97706, #f59e0b); }
.stat-icon.purple { background: linear-gradient(135deg, #7c3aed, #8b5cf6); }
.stat-icon.red { background: linear-gradient(135deg, #dc2626, #ef4444); }
.stat-icon.teal { background: linear-gradient(135deg, #0d9488, #14b8a6); }
.stat-icon.pink { background: linear-gradient(135deg, #db2777, #ec4899); }

.stat-body { min-width: 0; }
.stat-label { font-size: 12px; color: var(--muted); font-weight: 500; }
.stat-value { font-size: 20px; font-weight: 800; color: var(--text); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.stat-sub { font-size: 11px; color: var(--green-text); font-weight: 600; margin-top: 2px; }

/* ===== DASHBOARD GRID ===== */
.dash-grid { display: grid; grid-template-columns: 2fr 1fr; gap: 16px; margin-bottom: 16px; }
.dash-grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin-bottom: 16px; }

.card-title { font-size: 15px; font-weight: 700; color: var(--text); display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
.card-title small { font-size: 12px; color: var(--muted); font-weight: 500; }

.chart-wrap { position: relative; height: 260px; }
.chart-wrap.small { height: 200px; }

/* ===== TABLES ===== */
.table-wrap { overflow-x: auto; border-radius: 12px; border: 1px solid var(--border); background: var(--card); }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
thead { background: var(--bg); }
th {
  text-align: left;
  padding: 12px 14px;
  font-size: 11px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  color: var(--muted);
  border-bottom: 1px solid var(--border);
  white-space: nowrap;
}
td { padding: 12px 14px; border-bottom: 1px solid var(--border); color: var(--text); vertical-align: middle; }
tbody tr:last-child td { border-bottom: none; }
tbody tr:hover { background: var(--bg); }

.table-actions { display: flex; gap: 6px; }
.table-actions .icon-btn { width: 30px; height: 30px; }
.table-actions .icon-btn svg { width: 14px; height: 14px; }

/* ===== BADGES ===== */
.badge {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 3px 10px;
  border-radius: 20px;
  font-size: 11px;
  font-weight: 600;
  white-space: nowrap;
}
.badge-green { background: rgba(12,196,78,0.12); color: var(--green-text); }
.badge-red { background: rgba(239,68,68,0.12); color: var(--red); }
.badge-orange { background: rgba(245,158,11,0.15); color: #b45309; }
.badge-blue { background: rgba(59,130,246,0.12); color: var(--blue); }
.badge-purple { background: rgba(139,92,246,0.12); color: var(--purple); }
.badge-gray { background: var(--bg); color: var(--muted); border: 1px solid var(--border); }
.badge-teal { background: rgba(20,184,166,0.12); color: var(--teal); }

/* ===== FORMS ===== */
.form-group { margin-bottom: 16px; }
.form-group label { display: block; font-size: 12px; font-weight: 600; color: var(--text); margin-bottom: 6px; }
.form-group label .req { color: var(--red); }
.form-control {
  width: 100%;
  padding: 10px 12px;
  border: 1.5px solid var(--border);
  border-radius: 9px;
  font-size: 13px;
  background: var(--card);
  color: var(--text);
  outline: none;
  transition: border-color 0.2s, box-shadow 0.2s;
}
.form-control:focus { border-color: var(--green); box-shadow: 0 0 0 3px rgba(12,196,78,0.12); }
.form-control.error { border-color: var(--red); }
.form-error { font-size: 11px; color: var(--red); margin-top: 4px; min-height: 14px; }
.form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }

/* ===== TOOLBAR ===== */
.toolbar {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 16px;
  flex-wrap: wrap;
}
.toolbar .search-box {
  display: flex;
  align-items: center;
  gap: 8px;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 9px;
  padding: 0 12px;
  height: 40px;
  flex: 1;
  min-width: 200px;
  max-width: 320px;
}
.toolbar .search-box svg { width: 16px; height: 16px; color: var(--muted); }
.toolbar .search-box input { border: none; background: transparent; outline: none; font-size: 13px; color: var(--text); width: 100%; }
.toolbar select {
  height: 40px;
  padding: 0 12px;
  border-radius: 9px;
  border: 1px solid var(--border);
  background: var(--card);
  color: var(--text);
  font-size: 13px;
  outline: none;
  cursor: pointer;
}

/* ===== MODAL ===== */
.modal-container { position: fixed; inset: 0; z-index: 100; display: flex; align-items: center; justify-content: center; padding: 20px; }
.modal-backdrop { position: absolute; inset: 0; background: rgba(6,24,43,0.55); backdrop-filter: blur(3px); }
.modal-box {
  position: relative;
  background: var(--card);
  border-radius: 16px;
  width: 100%;
  max-width: 560px;
  max-height: 90vh;
  overflow-y: auto;
  padding: 24px;
  box-shadow: 0 24px 60px rgba(0,0,0,0.3);
  animation: modalIn 0.25s ease;
}
.modal-box.wide { max-width: 800px; }
@keyframes modalIn { from { opacity: 0; transform: translateY(20px) scale(0.98); } to { opacity: 1; transform: none; } }

.modal-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
.modal-header h3 { font-size: 17px; font-weight: 700; }
.modal-close { background: var(--bg); border: none; width: 32px; height: 32px; border-radius: 8px; display: flex; align-items: center; justify-content: center; color: var(--muted); }
.modal-close:hover { color: var(--red); }
.modal-footer { display: flex; justify-content: flex-end; gap: 10px; margin-top: 20px; padding-top: 16px; border-top: 1px solid var(--border); }

/* ===== TOAST ===== */
.toast-container { position: fixed; top: 20px; right: 20px; z-index: 200; display: flex; flex-direction: column; gap: 10px; }
.toast {
  display: flex;
  align-items: center;
  gap: 10px;
  background: var(--card);
  border-left: 4px solid var(--green);
  padding: 12px 16px;
  border-radius: 10px;
  box-shadow: 0 8px 24px rgba(6,24,43,0.15);
  font-size: 13px;
  font-weight: 500;
  min-width: 260px;
  animation: toastIn 0.3s ease;
  color: var(--text);
}
.toast.error { border-left-color: var(--red); }
.toast.warn { border-left-color: var(--orange); }
.toast svg { width: 18px; height: 18px; flex-shrink: 0; }
.toast.success svg { color: var(--green); }
.toast.error svg { color: var(--red); }
@keyframes toastIn { from { opacity: 0; transform: translateX(40px); } to { opacity: 1; transform: none; } }

/* ===== EMPTY STATE ===== */
.empty-state { text-align: center; padding: 48px 20px; color: var(--muted); }
.empty-state svg { width: 48px; height: 48px; margin-bottom: 12px; color: var(--border); }
.empty-state h4 { font-size: 15px; color: var(--text); margin-bottom: 6px; }
.empty-state p { font-size: 13px; margin-bottom: 16px; }

/* ===== POS ===== */
.pos-layout { display: grid; grid-template-columns: 1fr 380px; gap: 16px; }
.pos-products { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }
.pos-product-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 12px;
  cursor: pointer;
  transition: all 0.2s;
  text-align: left;
}
.pos-product-card:hover { border-color: var(--green); box-shadow: 0 4px 14px rgba(12,196,78,0.12); transform: translateY(-2px); }
.pos-product-card .p-name { font-size: 13px; font-weight: 600; margin-bottom: 4px; }
.pos-product-card .p-price { font-size: 13px; font-weight: 700; color: var(--green-text); }
.pos-product-card .p-stock { font-size: 11px; color: var(--muted); margin-top: 4px; }

.cart-panel {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 18px;
  display: flex;
  flex-direction: column;
  height: fit-content;
  position: sticky;
  top: 90px;
}
.cart-items { max-height: 320px; overflow-y: auto; margin-bottom: 12px; }
.cart-item { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--border); }
.cart-item:last-child { border-bottom: none; }
.cart-item .ci-info { flex: 1; min-width: 0; }
.cart-item .ci-name { font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cart-item .ci-price { font-size: 11px; color: var(--muted); }
.cart-qty { display: flex; align-items: center; gap: 6px; }
.cart-qty button {
  width: 24px; height: 24px;
  border-radius: 6px;
  border: 1px solid var(--border);
  background: var(--bg);
  display: flex; align-items: center; justify-content: center;
  color: var(--text);
  font-weight: 700;
}
.cart-qty button:hover { background: var(--green); color: #fff; border-color: var(--green); }
.cart-qty span { font-size: 13px; font-weight: 600; min-width: 20px; text-align: center; }
.cart-remove { background: none; border: none; color: var(--red); padding: 4px; }
.cart-remove svg { width: 15px; height: 15px; }

.cart-summary { border-top: 1px solid var(--border); padding-top: 12px; margin-top: auto; }
.summary-row { display: flex; justify-content: space-between; font-size: 13px; margin-bottom: 8px; }
.summary-row.total { font-size: 16px; font-weight: 800; color: var(--text); }
.summary-row .label { color: var(--muted); }

/* ===== SETTINGS ===== */
.settings-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.settings-section { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 20px; }
.settings-section h4 { font-size: 14px; font-weight: 700; margin-bottom: 16px; display: flex; align-items: center; gap: 8px; }
.settings-section h4 svg { width: 17px; height: 17px; color: var(--green-text); }

/* ===== DRAWER (mobile) ===== */
.drawer-overlay { position: fixed; inset: 0; background: rgba(6,24,43,0.5); z-index: 45; }

/* ===== RECEIPT PRINT ===== */
.receipt-print { display: none; }
@media print {
  body * { visibility: hidden; }
  .receipt-print, .receipt-print * { visibility: visible; }
  .receipt-print { display: block; position: absolute; left: 0; top: 0; width: 100%; padding: 20px; }
}

/* ===== RESPONSIVE ===== */
@media (max-width: 1100px) {
  .dash-grid { grid-template-columns: 1fr; }
  .dash-grid-3 { grid-template-columns: 1fr 1fr; }
  .pos-layout { grid-template-columns: 1fr; }
  .settings-grid { grid-template-columns: 1fr; }
}

@media (max-width: 900px) {
  .sidebar {
    position: fixed;
    left: 0; top: 0;
    transform: translateX(-100%);
    z-index: 50;
    box-shadow: 0 0 40px rgba(0,0,0,0.3);
  }
  .sidebar.mobile-open { transform: translateX(0); }
  .sidebar.collapsed { width: 250px; }
  .sidebar.collapsed .brand-name,
  .sidebar.collapsed .nav-item span { display: inline; }
  .sidebar.collapsed .nav-item { justify-content: flex-start; }
  .mobile-menu { display: inline-flex; }
  .topbar-title { display: none; }
  .global-search { width: 160px; }
}

@media (max-width: 700px) {
  .global-search { display: none; }
  .user-info { display: none; }
  .dash-grid-3 { grid-template-columns: 1fr; }
  .form-row { grid-template-columns: 1fr; }
  .main-content { padding: 16px; }

/* ============================================================
   2. STORAGE SERVICE
   ============================================================ */
const Storage = {
  KEYS: {
    products: 'kitchenware_products_v1',
    sales: 'kitchenware_sales_v1',
    payments: 'kitchenware_payments_v1',
    customers: 'kitchenware_customers_v1',
    suppliers: 'kitchenware_suppliers_v1',
    inventory: 'kitchenware_inventory_v1',
    expenses: 'kitchenware_expenses_v1',
    settings: 'kitchenware_settings_v1',
    session: 'kitchenware_session_v1',
    lastBackup: 'kitchenware_lastbackup_v1'
  },

  getData(key, fallback = null) {
    try {
      const raw = localStorage.getItem(key);
      if (raw === null) return fallback;
      return JSON.parse(raw);
    } catch (e) {
      console.warn('Storage read error:', key, e);
      return fallback;
    }
  },

  setData(key, value) {
    try {
      localStorage.setItem(key, JSON.stringify(value));
      return true;
    } catch (e) {
      console.error('Storage write error:', key, e);
      if (e.name === 'QuotaExceededError') {
        UI.toast(t('errors.saveFailed') + ' (quota)', 'error');
      }
      return false;
    }
  },

  removeData(key) {
    try { localStorage.removeItem(key); return true; }
    catch (e) { return false; }
  },

  exportBackup() {
    const data = {};
    Object.values(this.KEYS).forEach(k => {
      data[k] = this.getData(k, null);
    });
    const backup = { exportedAt: new Date().toISOString(), app: 'kitchenware', version: 1, data };
    this.setData(this.KEYS.lastBackup, new Date().toISOString());
    return backup;
  },

  importBackup(fileData) {
    if (!this.validateBackup(fileData)) throw new Error('Invalid backup');
    Object.entries(fileData.data).forEach(([key, value]) => {
      if (value !== null && value !== undefined) this.setData(key, value);
    });
    return true;
  },

  validateBackup(data) {
    if (!data || typeof data !== 'object') return false;
    if (data.app !== 'kitchenware') return false;
    if (!data.data || typeof data.data !== 'object') return false;
    return true;
  }
};

const Utils = {
  uid(prefix = 'ID') {
    return prefix + '-' + Date.now().toString(36).toUpperCase() + '-' + Math.random().toString(36).substr(2, 5).toUpperCase();
  },

  now() { return new Date().toISOString(); },

  formatMoney(amount, currency) {
    const symbols = { USD: '$', SLSH: 'SLSH ', ETB: 'ETB ' };
    const num = Number(amount) || 0;
    const formatted = num.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    return (symbols[currency] || currency + ' ') + formatted;
  },

  formatDate(iso) {
    if (!iso) return '—';
    const d = new Date(iso);
    if (isNaN(d.getTime())) return '—';
    const fmt = (State.settings && State.settings.dateFormat) || 'DD/MM/YYYY';
    const dd = String(d.getDate()).padStart(2, '0');
    const mm = String(d.getMonth() + 1).padStart(2, '0');
    const yyyy = d.getFullYear();
    if (fmt === 'MM/DD/YYYY') return `${mm}/${dd}/${yyyy}`;
    if (fmt === 'YYYY-MM-DD') return `${yyyy}-${mm}-${dd}`;
    return `${dd}/${mm}/${yyyy}`;
  },

  formatDateTime(iso) {
    if (!iso) return '—';
    const d = new Date(iso);
    if (isNaN(d.getTime())) return '—';
    return this.formatDate(iso) + ' ' + d.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' });
  },

  escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = String(str == null ? '' : str);
    return div.innerHTML;
  },

  debounce(fn, delay = 300) {
    let timer;
    return (...args) => {
      clearTimeout(timer);
      timer = setTimeout(() => fn(...args), delay);
    };
  },

  sum(arr) { return arr.reduce((a, b) => a + (Number(b) || 0), 0); },

  groupBy(arr, keyFn) {
    return arr.reduce((acc, item) => {
      const k = keyFn(item);
      if (!acc[k]) acc[k] = [];
      acc[k].push(item);
      return acc;
    }, {});
  }
};

const UI = {
  toast(message, type = 'success') {
    const container = document.getElementById('toast-container');
    const toast = document.createElement('div');
    toast.className = 'toast ' + type;
    const iconName = type === 'error' ? 'alert-circle' : type === 'warn' ? 'alert-triangle' : 'check-circle';
    const icon = document.createElement('i');
    icon.setAttribute('data-lucide', iconName);
    toast.appendChild(icon);
    const span = document.createElement('span');
    span.textContent = message;
    toast.appendChild(span);
    container.appendChild(toast);
    if (window.lucide) lucide.createIcons({ nodes: [toast] });
    setTimeout(() => {
      toast.style.opacity = '0';
      toast.style.transform = 'translateX(40px)';
      setTimeout(() => toast.remove(), 300);
    }, 3000);
  },

  openModal(contentBuilder, options = {}) {
    const container = document.getElementById('modal-container');
    const box = document.getElementById('modal-box');
    box.className = 'modal-box' + (options.wide ? ' wide' : '');
    box.innerHTML = '';
    contentBuilder(box);
    container.classList.remove('hidden');
    if (window.lucide) lucide.createIcons({ nodes: [box] });
    const firstInput = box.querySelector('input, select, textarea');
    if (firstInput) setTimeout(() => firstInput.focus(), 100);
  },

  closeModal() {
    document.getElementById('modal-container').classList.add('hidden');
    document.getElementById('modal-box').innerHTML = '';
  },

  confirm(title, message, onConfirm, danger = true) {
    this.openModal(box => {
      const header = document.createElement('div');
      header.className = 'modal-header';
      header.innerHTML = `<h3>${Utils.escapeHtml(title)}</h3>`;
      const closeBtn = document.createElement('button');
      closeBtn.className = 'modal-close';
      closeBtn.innerHTML = '<i data-lucide="x"></i>';
      closeBtn.onclick = () => this.closeModal();
      header.appendChild(closeBtn);
      box.appendChild(header);

      const p = document.createElement('p');
      p.style.cssText = 'color:var(--muted);font-size:13px;line-height:1.6;margin-bottom:8px;';
      p.textContent = message;
      box.appendChild(p);

      const footer = document.createElement('div');
      footer.className = 'modal-footer';
      const cancelBtn = document.createElement('button');
      cancelBtn.className = 'btn btn-secondary';
      cancelBtn.textContent = t('btn.cancel');
      cancelBtn.onclick = () => this.closeModal();
      const confirmBtn = document.createElement('button');
      confirmBtn.className = danger ? 'btn btn-danger' : 'btn btn-primary';
      confirmBtn.textContent = t('btn.confirm');
      confirmBtn.onclick = () => {
        this.closeModal();
        onConfirm();
      };
      footer.appendChild(cancelBtn);
      footer.appendChild(confirmBtn);
      box.appendChild(footer);
    });
  },

  renderIcons(root = document) {
    if (window.lucide) lucide.createIcons({ nodes: root.querySelectorAll ? root.querySelectorAll('[data-lucide]') : [] });
  }
};

}

function persistState(key) {
  if (!key) {
    Storage.setData(Storage.KEYS.products, State.products);
    Storage.setData(Storage.KEYS.sales, State.sales);
    Storage.setData(Storage.KEYS.payments, State.payments);
    Storage.setData(Storage.KEYS.customers, State.customers);
    Storage.setData(Storage.KEYS.suppliers, State.suppliers);
    Storage.setData(Storage.KEYS.inventory, State.inventory);
    Storage.setData(Storage.KEYS.expenses, State.expenses);
    Storage.setData(Storage.KEYS.settings, State.settings);
    return;
  }
  const map = {
    products: Storage.KEYS.products,
    sales: Storage.KEYS.sales,
    payments: Storage.KEYS.payments,
    customers: Storage.KEYS.customers,
    suppliers: Storage.KEYS.suppliers,
    inventory: Storage.KEYS.inventory,
    expenses: Storage.KEYS.expenses,
    settings: Storage.KEYS.settings
  };
  if (map[key]) Storage.setData(map[key], State[key]);
}

/* ============================================================
   7. PERMISSIONS
   ============================================================ */
function hasPermission(page) {
  const role = State.session ? State.session.role : null;
  if (!role) return false;
  if (role === 'Owner') return true;
  if (role === 'Staff') {
    return ['dashboard', 'products', 'inventory', 'pos', 'customers', 'reports'].includes(page);
  }
  if (role === 'Cashier') {
    return ['dashboard', 'pos', 'payments', 'customers'].includes(page);
  }
  return false;
}

function canDelete() {
  return State.session && State.session.role === 'Owner';
}

function initTopbar() {

      State.settings.language = currentLang;
      persistState('settings');

function getCurrencyStats() {
  const stats = {};
  CURRENCIES.forEach(c => {
    const sales = State.sales.filter(s => s.currency === c);
    const expenses = State.expenses.filter(e => e.currency === c);
    const totalSales = Utils.sum(sales.map(s => s.total));
    const totalExpenses = Utils.sum(expenses.map(e => e.amount));

    let cogs = 0;
    sales.forEach(sale => {
      sale.items.forEach(item => {
        const product = State.products.find(p => p.id === item.productId);
        if (product) {
          const cost = item.price && item.price > 0 ? (product.costPrice || 0) : 0;
          cogs += (product.costPrice || 0) * item.qty;
        }
      });
    });
    // Gross profit = revenue - cogs (excluding discounts already in total)
    const grossProfit = totalSales - cogs;
    const netProfit = grossProfit - totalExpenses;
    stats[c] = { totalSales, totalExpenses, cogs, grossProfit, netProfit, salesCount: sales.length };
  });
  return stats;
}

function renderCharts(mainCurrency) {
  // Destroy old charts
  Object.values(State.charts).forEach(c => { try { c.destroy(); } catch (e) {} });
  State.charts = {};

  const isDark = document.body.classList.contains('dark');
  const gridColor = isDark ? 'rgba(138,163,184,0.15)' : 'rgba(106,125,144,0.12)';
  const textColor = isDark ? '#8aa3b8' : '#6a7d90';

  // Sales trend - last 7 days
  const days = [];
  const totals = [];
  for (let i = 6; i >= 0; i--) {
    const d = new Date();
    d.setDate(d.getDate() - i);
    const dayKey = d.toISOString().slice(0, 10);
    days.push(d.toLocaleDateString('en-US', { weekday: 'short' }));
    const dayTotal = State.sales
      .filter(s => s.currency === mainCurrency && s.createdAt && s.createdAt.slice(0, 10) === dayKey)
      .reduce((a, s) => a + s.total, 0);
    totals.push(dayTotal);
  }

  const trendCtx = document.getElementById('salesTrendChart');
  if (trendCtx && window.Chart) {
    const ctx = trendCtx.getContext('2d');
    const grad = ctx.createLinearGradient(0, 0, 0, 260);
    grad.addColorStop(0, 'rgba(12,196,78,0.25)');
    grad.addColorStop(1, 'rgba(12,196,78,0)');
    State.charts.trend = new Chart(ctx, {
      type: 'line',
      data: {
        labels: days,
        datasets: [{
          label: 'Sales (' + mainCurrency + ')',
          data: totals,
          borderColor: '#0cc44e',
          backgroundColor: grad,
          fill: true,
          tension: 0.4,
          pointBackgroundColor: '#0cc44e',
          pointBorderColor: '#fff',
          pointBorderWidth: 2,
          pointRadius: 4,
          borderWidth: 2.5,
        }]
      },
      options: {
        responsive: true, maintainAspectRatio: false,
        plugins: { legend: { display: false } },
        scales: {
          x: { grid: { display: false }, ticks: { color: textColor, font: { size: 11 } } },
          y: { grid: { color: gridColor }, ticks: { color: textColor, font: { size: 11 } }, beginAtZero: true }
        }
      }
    });
  }

  // Payment mix (doughnut)
  const methodLabels = {};
  State.payments.forEach(p => {
    if (p.currency !== mainCurrency) return;
    const m = p.method || 'cash';
    methodLabels[m] = (methodLabels[m] || 0) + p.amount;
  });
  const mixCtx = document.getElementById('paymentMixChart');
  if (mixCtx && window.Chart) {
    const labels = Object.keys(methodLabels);
    const data = Object.values(methodLabels);
    const colors = ['#0cc44e', '#3b82f6', '#f59e0b', '#8b5cf6', '#ef4444', '#14b8a6', '#ec4899'];
    if (labels.length === 0) {
      mixCtx.parentElement.innerHTML = `<div class="empty-state" style="height:100%;display:flex;flex-direction:column;justify-content:center;"><i data-lucide="pie-chart"></i><p>${t('common.noData')}</p></div>`;
    } else {
      State.charts.mix = new Chart(mixCtx.getContext('2d'), {
        type: 'doughnut',
        data: { labels: labels.map(l => formatMethodName(l)), datasets: [{ data, backgroundColor: colors.slice(0, labels.length), borderWidth: 0 }] },
        options: {
          responsive: true, maintainAspectRatio: false, cutout: '65%',
          plugins: { legend: { position: 'bottom', labels: { color: textColor, font: { size: 11 }, boxWidth: 12, padding: 10 } } }
        }
      });
    }
  }
}

function formatMethodName(m) {
  const map = {
    cash: t('method.cash'),
    zaad: t('method.zaad'),
    edahab: t('method.edahab'),
    tele_birr: t('method.telebirr'),
    mpesa: t('method.mpesa'),
    ebirr: t('method.ebirr')
  };
  return map[m] || m;
}

        <option value="in" ${State.productFilters.stock === 'in' ? 'selected' : ''}>${t('products.inStock')}</option>
        <option value="low" ${State.productFilters.stock === 'low' ? 'selected' : ''}>${t('products.lowStock')}</option>
        <option value="out" ${State.productFilters.stock === 'out' ? 'selected' : ''}>${t('products.outOfStock')}</option>
      </select>
    </div>

  `;

  document.getElementById('prod-search').addEventListener('input', Utils.debounce(e => {
    State.productFilters.search = e.target.value;
    State.productFilters.page = 1;
    renderProductsTable();
  }, 250));

    State.productFilters.category = e.target.value;
    State.productFilters.page = 1;
    renderProductsTable();
  });

  document.getElementById('prod-stock-filter').addEventListener('change', e => {
    State.productFilters.stock = e.target.value;
    State.productFilters.page = 1;
    renderProductsTable();
  });

  const addBtn = document.getElementById('add-product-btn');
  if (addBtn) addBtn.addEventListener('click', () => openProductForm());

  renderProductsTable();
  if (window.lucide) lucide.createIcons();
}

function getFilteredProducts() {
  let list = State.products.slice();
  const f = State.productFilters;
  if (f.search) {
    const q = f.search.toLowerCase();
    list = list.filter(p => p.name.toLowerCase().includes(q) || p.id.toLowerCase().includes(q));
  }
  if (f.category) list = list.filter(p => p.category === f.category);
  if (f.stock === 'out') list = list.filter(p => p.stock === 0);
  else if (f.stock === 'low') list = list.filter(p => p.stock > 0 && p.stock <= (p.minStock || 10));
  else if (f.stock === 'in') list = list.filter(p => p.stock > (p.minStock || 10));
  // Sort
  if (f.sort === 'name') list.sort((a, b) => a.name.localeCompare(b.name));
  else if (f.sort === 'stock') list.sort((a, b) => a.stock - b.stock);
  else if (f.sort === 'price') list.sort((a, b) => a.sellingPrice - b.sellingPrice);
  return list;
}

function renderProductsTable() {
  const container = document.getElementById('products-table-container');
  if (!container) return;
  const all = getFilteredProducts();
  const perPage = State.productFilters.perPage;
  const totalPages = Math.max(1, Math.ceil(all.length / perPage));
  if (State.productFilters.page > totalPages) State.productFilters.page = totalPages;
  const page = State.productFilters.page;
  const list = all.slice((page - 1) * perPage, page * perPage);

  if (all.length === 0) {
    container.innerHTML = `<div class="empty-state card"><i data-lucide="package"></i><h4>No products found</h4><p>Try adjusting filters or add a new product.</p></div>`;
    if (window.lucide) lucide.createIcons();
    return;
  }

  const tbl = document.createElement('div');
  tbl.className = 'table-wrap';
  tbl.innerHTML = `
    <table>
      <thead>
        <tr>
          <th>${t('products.sku')}</th>
          <th>${t('products.name')}</th>
          <th>${t('common.category')}</th>
          <th>${t('products.price')}</th>
          <th>${t('products.stock')}</th>
          <th>${t('common.status')}</th>
          <th>${t('common.actions')}</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  `;
  const tbody = tbl.querySelector('tbody');
  list.forEach(p => {
    const tr = document.createElement('tr');
    const statusBadge = p.stock === 0
      ? `<span class="badge badge-red">${t('products.outOfStock')}</span>`
      : p.stock <= (p.minStock || 10)
        ? `<span class="badge badge-orange">${t('products.lowStock')}</span>`
        : `<span class="badge badge-green">${t('products.inStock')}</span>`;

    const canEdit = State.session.role === 'Owner' || State.session.role === 'Staff';
    const canDel = canDelete();

    tr.innerHTML = `
      <td><code style="font-size:11px;color:var(--muted);">${Utils.escapeHtml(p.id)}</code></td>
      <td style="font-weight:600;">${Utils.escapeHtml(p.name)}</td>
      <td>${t('cat.' + p.category) || p.category}</td>
      <td style="font-weight:600;">${Utils.formatMoney(p.sellingPrice, p.currency)}</td>
      <td>${p.stock}</td>
      <td>${statusBadge}</td>
      <td></td>
    `;
    const actions = document.createElement('td');
    actions.className = 'table-actions';
    if (canEdit) {
      const editBtn = document.createElement('button');
      editBtn.className = 'icon-btn';
      editBtn.title = t('btn.edit');
      editBtn.innerHTML = '<i data-lucide="edit-2"></i>';
      editBtn.addEventListener('click', () => openProductForm(p.id));
      actions.appendChild(editBtn);
    }
    if (canDel) {
      const delBtn = document.createElement('button');
      delBtn.className = 'icon-btn';
      delBtn.title = t('btn.delete');
      delBtn.style.color = 'var(--red)';
      delBtn.innerHTML = '<i data-lucide="trash-2"></i>';
      delBtn.addEventListener('click', () => confirmDeleteProduct(p.id));
      actions.appendChild(delBtn);
    }
    tr.replaceChild(actions, tr.lastElementChild);
    tbody.appendChild(tr);
  });
  container.innerHTML = '';
  container.appendChild(tbl);

  // Pagination
  if (totalPages > 1) {
    const pag = document.createElement('div');
    pag.style.cssText = 'display:flex;align-items:center;justify-content:space-between;margin-top:16px;flex-wrap:wrap;gap:10px;';
    pag.innerHTML = `<span style="font-size:12px;color:var(--muted);">Showing ${(page-1)*perPage+1}–${Math.min(page*perPage, all.length)} of ${all.length}</span>`;
    const btns = document.createElement('div');
    btns.style.cssText = 'display:flex;gap:6px;';
    for (let i = 1; i <= totalPages; i++) {
      const b = document.createElement('button');
      b.className = 'btn btn-sm ' + (i === page ? 'btn-primary' : 'btn-secondary');
      b.textContent = i;
      b.addEventListener('click', () => {
        State.productFilters.page = i;
        renderProductsTable();
      });
      btns.appendChild(b);
    }
    pag.appendChild(btns);
    container.appendChild(pag);
  }
  if (window.lucide) lucide.createIcons();
}

        category: fd.get('category'),

        sellingPrice: parseFloat(fd.get('sellingPrice')) || 0,

        stock: parseInt(fd.get('stock'), 10) || 0,
        minStock: parseInt(fd.get('minStock'), 10) || 10,
        supplier: fd.get('supplier'),
        unit: String(fd.get('unit') || 'pcs').trim() || 'pcs',
        createdAt: editing ? editing.createdAt : Utils.now(),
        updatedAt: Utils.now()
      };

      if (!data.id || !data.name || !data.category) { UI.toast(t('errors.required'), 'error'); return; }
      if (data.costPrice < 0 || data.sellingPrice < 0 || data.stock < 0) { UI.toast(t('errors.invalidNumber'), 'error'); return; }

      if (!editing) {
        if (State.products.some(p => p.id === data.id)) {
          UI.toast(t('errors.duplicateSku'), 'error');
          return;
        }
        State.products.push(data);
        // Log initial inventory if stock > 0
        if (data.stock > 0) {
          State.inventory.push({
            id: Utils.uid('INV'),
            productId: data.id,
            productName: data.name,
            type: 'stock_in',
            quantity: data.stock,
            previousStock: 0,
            newStock: data.stock,
            reason: 'Initial stock',
            reference: 'NEW-PRODUCT',
            createdAt: Utils.now(),
            userId: State.session.name
          });
        }
      } else {
        const idx = State.products.findIndex(p => p.id === editing.id);
        const oldStock = State.products[idx].stock;
        State.products[idx] = data;
        // If stock changed directly, log it as adjustment
        if (oldStock !== data.stock) {
          State.inventory.push({
            id: Utils.uid('INV'),
            productId: data.id,
            productName: data.name,
            type: 'adjust',
            quantity: Math.abs(data.stock - oldStock),
            previousStock: oldStock,
            newStock: data.stock,
            reason: 'Manual adjustment via edit',
            reference: '',
            createdAt: Utils.now(),
            userId: State.session.name
          });
        }
      }

      persistState('products');
      persistState('inventory');
      UI.toast(t('success.saved'), 'success');
      UI.closeModal();
      renderProductsTable();
      if (State.currentPage === 'dashboard') renderDashboard();
    });
  }, { wide: true });

  if (window.lucide) lucide.createIcons();
}

function confirmDeleteProduct(id) {
  const p = State.products.find(x => x.id === id);
  if (!p) return;
  UI.confirm(t('btn.delete'), t('common.confirmDelete') + '\n\n' + p.name, () => {
    State.products = State.products.filter(x => x.id !== id);
    persistState('products');
    UI.toast(t('success.deleted'), 'success');
    renderProductsTable();
  });
}

    close.onclick = () => UI.closeModal();

    box.appendChild(header);

    const form = document.createElement('form');
    form.id = 'inv-form';
    form.innerHTML = `
      <div class="form-group">
        <label>${t('inventory.type')} <span class="req">*</span></label>
        <select class="form-control" name="type" required>
          <option value="stock_in" ${defaultType === 'stock_in' ? 'selected' : ''}>${t('inventory.stockIn')}</option>
          <option value="stock_out" ${defaultType === 'stock_out' ? 'selected' : ''}>${t('inventory.stockOut')}</option>
          <option value="adjust" ${defaultType === 'adjust' ? 'selected' : ''}>${t('inventory.adjust')}</option>
          <option value="damaged">${t('inventory.damaged')}</option>
          <option value="returned">${t('inventory.returned')}</option>
        </select>
      </div>
      <div class="form-group">
        <label>${t('products.name')} <span class="req">*</span></label>
        <select class="form-control" name="productId" required>
          <option value="">--</option>
          ${State.products.map(p => `<option value="${p.id}">${Utils.escapeHtml(p.name)} (${p.stock} ${p.unit})</option>`).join('')}
        </select>
      </div>
      <div class="form-group">
        <label>${t('inventory.qty')} <span class="req">*</span></label>
        <input type="number" min="1" class="form-control" name="quantity" required value="1">
        <div class="form-error"></div>
      </div>
      <div class="form-group">
        <label>${t('inventory.reason')}</label>
        <input type="text" class="form-control" name="reason" placeholder="Reason for movement">
      </div>
    `;
    box.appendChild(form);

    const footer = document.createElement('div');
    footer.className = 'modal-footer';
    footer.innerHTML = `<button type="button" class="btn btn-secondary" id="inv-cancel">${t('btn.cancel')}</button><button type="submit" form="inv-form" class="btn btn-primary">${t('btn.save')}</button>`;
    box.appendChild(footer);
    document.getElementById('inv-cancel').onclick = () => UI.closeModal();

    form.addEventListener('submit', (e) => {
      e.preventDefault();
      const fd = new FormData(form);
      const type = fd.get('type');
      const productId = fd.get('productId');
      const quantity = parseInt(fd.get('quantity'), 10);
      const reason = String(fd.get('reason') || '').trim();
      if (!productId || !quantity || quantity <= 0) { UI.toast(t('errors.required'), 'error'); return; }
      const product = State.products.find(p => p.id === productId);
      if (!product) return;

      let newStock;
      if (type === 'stock_in' || type === 'returned') newStock = product.stock + quantity;
      else {
        newStock = product.stock - quantity;
        if (newStock < 0) { UI.toast(t('errors.insufficientStock'), 'error'); return; }
      }

      const previousStock = product.stock;
      product.stock = newStock;
      product.updatedAt = Utils.now();

      State.inventory.push({
        id: Utils.uid('INV'),
        productId: product.id,
        productName: product.name,
        type,
        quantity,
        previousStock,
        newStock,
        reason: reason || '',
        reference: '',
        createdAt: Utils.now(),
        userId: State.session.name
      });

      persistState('products');
      persistState('inventory');
      UI.toast(t('success.saved'), 'success');
      UI.closeModal();
      renderInventoryTables();
      if (State.currentPage === 'dashboard') renderDashboard();
    });
  });
  if (window.lucide) lucide.createIcons();
}

function getPaymentMethodsFor(region, currency) {
  // Somaliland: cash USD/SLSH, ZAAD/eDahab USD/SLSH
  // Ethiopia: cash ETB only, Telebirr/eBirr ETB only
  if (region === 'ethiopia') {
    if (currency !== 'ETB') return ['cash']; // only cash; but ETB only anyway
    return ['cash', 'tele_birr', 'mpesa', 'ebirr'];
  }
  // somaliland
  if (currency === 'ETB') return ['cash']; // shouldn't happen often
  return ['cash', 'zaad', 'edahab'];
}

function addToCart(productId) {
  const product = State.products.find(p => p.id === productId);
  if (!product) return;
  // Currency check: product currency must match POS currency
  if (product.currency !== State.posCurrency) {
    UI.toast(`Product is priced in ${product.currency}. Switch POS currency.`, 'warn');
    return;
  }
  const existing = State.cart.find(c => c.productId === productId);
  const currentQty = existing ? existing.qty : 0;
  if (currentQty + 1 > product.stock) { UI.toast(t('errors.insufficientStock'), 'error'); return; }
  if (existing) existing.qty += 1;
  else State.cart.push({ productId, name: product.name, price: product.sellingPrice, qty: 1, maxStock: product.stock });
  renderPOSCart();
}

function renderPOSCart() {
  const cartEl = document.getElementById('cart-items');
  const countEl = document.getElementById('cart-count');
  if (!cartEl) return;
  if (State.cart.length === 0) {
    cartEl.innerHTML = `<div class="empty-state" style="padding:24px 8px;"><i data-lucide="shopping-cart"></i><p style="font-size:12px;">${t('pos.emptyCart')}</p><p style="font-size:11px;margin-top:4px;">${t('pos.addProducts')}</p></div>`;
    countEl.textContent = '0';
  } else {
    cartEl.innerHTML = '';
    State.cart.forEach(item => {
      const row = document.createElement('div');
      row.className = 'cart-item';
      row.innerHTML = `
        <div class="ci-info">
          <div class="ci-name">${Utils.escapeHtml(item.name)}</div>
          <div class="ci-price">${Utils.formatMoney(item.price, State.posCurrency)}</div>
        </div>
        <div class="cart-qty">
          <button type="button" data-act="dec">−</button>
          <span>${item.qty}</span>
          <button type="button" data-act="inc">+</button>
        </div>
        <button type="button" class="cart-remove" data-act="rm"><i data-lucide="x"></i></button>
      `;
      row.querySelector('[data-act="dec"]').onclick = () => { item.qty = Math.max(1, item.qty - 1); renderPOSCart(); };
      row.querySelector('[data-act="inc"]').onclick = () => {
        if (item.qty + 1 > item.maxStock) { UI.toast(t('errors.insufficientStock'), 'error'); return; }
        item.qty += 1; renderPOSCart();
      };
      row.querySelector('[data-act="rm"]').onclick = () => { State.cart = State.cart.filter(c => c.productId !== item.productId); renderPOSCart(); };
      cartEl.appendChild(row);
    });
    countEl.textContent = String(State.cart.reduce((a, c) => a + c.qty, 0));
  }

  // Summary
  const subtotal = State.cart.reduce((a, c) => a + c.price * c.qty, 0);
  const discount = parseFloat(document.getElementById('pos-discount').value) || 0;
  const total = Math.max(0, subtotal - discount);
  const paid = parseFloat(document.getElementById('pos-paid').value) || 0;
  const change = Math.max(0, paid - total);

  document.getElementById('sum-subtotal').textContent = Utils.formatMoney(subtotal, State.posCurrency);
  document.getElementById('sum-discount').textContent = Utils.formatMoney(discount, State.posCurrency);
  document.getElementById('sum-total').textContent = Utils.formatMoney(total, State.posCurrency);
  document.getElementById('sum-change').textContent = Utils.formatMoney(change, State.posCurrency);

  if (window.lucide) lucide.createIcons({ nodes: [cartEl] });
}

function updatePOSMethods() {
  const methodEl = document.getElementById('pos-method');
  if (!methodEl) return;
  const methods = getPaymentMethodsFor(State.settings.region, State.posCurrency);
  methodEl.innerHTML = methods.map(m => `<option value="${m}">${formatMethodName(m)}</option>`).join('');
}

function completeSale() {
  if (State.isProcessingSale) return; // prevent duplicate
  if (State.cart.length === 0) { UI.toast('Cart is empty', 'error'); return; }
  const discount = parseFloat(document.getElementById('pos-discount').value) || 0;
  const subtotal = State.cart.reduce((a, c) => a + c.price * c.qty, 0);
  const total = Math.max(0, subtotal - discount);
  const paid = parseFloat(document.getElementById('pos-paid').value) || 0;
  const method = document.getElementById('pos-method').value;
  const customerId = document.getElementById('pos-customer').value;
  const currency = State.posCurrency;

  // Validation
  if (paid < total) { UI.toast('Amount paid is less than total', 'error'); return; }
  // Stock check
  for (const item of State.cart) {
    const p = State.products.find(x => x.id === item.productId);
    if (!p || p.stock < item.qty) { UI.toast(t('errors.insufficientStock') + ': ' + item.name, 'error'); return; }
  }

  // Region/method validation
  const allowed = getPaymentMethodsFor(State.settings.region, currency);
  if (!allowed.includes(method)) { UI.toast('Invalid payment method for region/currency', 'error'); return; }

  State.isProcessingSale = true;
  const checkoutBtn = document.getElementById('pos-checkout');
  checkoutBtn.disabled = true;

  try {
    const now = Utils.now();
    const saleId = Utils.uid('SALE');
    const sale = {
      id: saleId,
      items: State.cart.map(c => ({ productId: c.productId, name: c.name, price: c.price, qty: c.qty })),
      subtotal, discount, total, currency,
      paymentMethod: method,
      amountPaid: paid,
      change: Math.max(0, paid - total),
      customerId: customerId || null,
      customerName: customerId ? (State.customers.find(c => c.id === customerId) || {}).name || 'Customer' : 'Walk-in Customer',
      userId: State.session.name,
      createdAt: now
    };

    // Deduct stock atomically
    const inventoryLogs = [];
    State.cart.forEach(item => {
      const p = State.products.find(x => x.id === item.productId);
      const prev = p.stock;
      p.stock = prev - item.qty;
      p.updatedAt = now;
      inventoryLogs.push({
        id: Utils.uid('INV'),
        productId: p.id,
        productName: p.name,
        type: 'stock_out',
        quantity: item.qty,
        previousStock: prev,
        newStock: p.stock,
        reason: 'Sale',
        reference: saleId,
        createdAt: now,
        userId: State.session.name
      });
    });

    const payment = {
      id: Utils.uid('TXN'),
      saleId,
      method,
      currency,
      amount: total,
      status: 'paid',
      reference: '',
      createdAt: now
    };

    State.sales.push(sale);
    State.payments.push(payment);
    inventoryLogs.forEach(l => State.inventory.push(l));

    persistState('sales');
    persistState('payments');
    persistState('products');
    persistState('inventory');

    UI.toast(t('success.saleComplete'), 'success');
    printReceipt(sale, payment);

    // Clear cart
    State.cart = [];
    document.getElementById('pos-discount').value = '0';
    document.getElementById('pos-paid').value = '0';
    renderPOSCart();
    renderPOSProducts('');
  } catch (err) {
    console.error(err);
    UI.toast('Sale failed: ' + err.message, 'error');
  } finally {
    State.isProcessingSale = false;
    checkoutBtn.disabled = false;
  }
}

function renderCustomersTable() {
  const container = document.getElementById('customers-table');
  if (State.customers.length === 0) {
    container.innerHTML = `<div class="empty-state card"><i data-lucide="users"></i><p>${t('common.noData')}</p></div>`;

  }
  const tbl = document.createElement('div');

  const tbody = tbl.querySelector('tbody');
  State.customers.forEach(c => {
    const sales = State.sales.filter(s => s.customerId === c.id);
    const purchases = {};
    CURRENCIES.forEach(cur => { purchases[cur] = Utils.sum(sales.filter(s => s.currency === cur).map(s => s.total)); });
    const purchaseStr = CURRENCIES.filter(cur => purchases[cur] > 0).map(cur => Utils.formatMoney(purchases[cur], cur)).join(' · ') || '—';
    const tr = document.createElement('tr');
    tr.innerHTML = `<td style="font-weight:600;">${Utils.escapeHtml(c.name)}</td><td>${Utils.escapeHtml(c.phone || '—')}</td><td>${Utils.escapeHtml(c.email || '—')}</td><td>${purchaseStr}</td><td></td>`;

    act.className = 'table-actions';
    const editBtn = document.createElement('button');
    editBtn.className = 'icon-btn'; editBtn.innerHTML = '<i data-lucide="edit-2"></i>';

        UI.toast(t('success.deleted'), 'success');
        renderCustomersTable();
      });
    };
    act.appendChild(editBtn); act.appendChild(delBtn);
    tr.replaceChild(act, tr.lastElementChild);
    tbody.appendChild(tr);
  });
  container.innerHTML = '';
  container.appendChild(tbl);
  if (window.lucide) lucide.createIcons();

      <div class="form-group"><label>${t('common.name')} <span class="req">*</span></label><input type="text" class="form-control" name="name" required value="${editing ? Utils.escapeHtml(editing.name) : ''}"></div>

      UI.toast(t('success.saved'), 'success');
      UI.closeModal();
      renderCustomersTable();
    });
  });
  if (window.lucide) lucide.createIcons();
}

function generateReport() {
  const from = document.getElementById('report-from').value;
  const to = document.getElementById('report-to').value;
  const container = document.getElementById('report-content');
  const fromTs = from ? new Date(from + 'T00:00:00').getTime() : 0;
  const toTs = to ? new Date(to + 'T23:59:59').getTime() : Date.now();
  const sales = State.sales.filter(s => {
    const ts = new Date(s.createdAt).getTime();
    return ts >= fromTs && ts <= toTs;
  });
  const expenses = State.expenses.filter(e => {
    const ts = new Date(e.date).getTime();
    return ts >= fromTs && ts <= toTs;
  });

  // Currency-separated summary
  let html = '';
  CURRENCIES.forEach(cur => {
    const curSales = sales.filter(s => s.currency === cur);
    const curExp = expenses.filter(e => e.currency === cur);
    const rev = Utils.sum(curSales.map(s => s.total));
    const expTotal = Utils.sum(curExp.map(e => e.amount));
    let cogs = 0;
    curSales.forEach(s => s.items.forEach(it => {
      const p = State.products.find(x => x.id === it.productId);
      if (p) cogs += (p.costPrice || 0) * it.qty;
    }));
    const gross = rev - cogs;
    const net = gross - expTotal;
    if (rev === 0 && expTotal === 0) return;
    html += `
      <div class="card" style="margin-bottom:16px;">
        <div class="card-title">${cur} ${t('reports.profit')}</div>
        <div class="stats-grid" style="margin:0;">
          <div class="stat-card"><div class="stat-icon green"><i data-lucide="dollar-sign"></i></div><div class="stat-body"><div class="stat-label">Revenue</div><div class="stat-value">${Utils.formatMoney(rev, cur)}</div></div></div>
          <div class="stat-card"><div class="stat-icon orange"><i data-lucide="package"></i></div><div class="stat-body"><div class="stat-label">COGS</div><div class="stat-value">${Utils.formatMoney(cogs, cur)}</div></div></div>
          <div class="stat-card"><div class="stat-icon blue"><i data-lucide="trending-up"></i></div><div class="stat-body"><div class="stat-label">Gross</div><div class="stat-value">${Utils.formatMoney(gross, cur)}</div></div></div>
          <div class="stat-card"><div class="stat-icon red"><i data-lucide="receipt"></i></div><div class="stat-body"><div class="stat-label">Expenses</div><div class="stat-value">${Utils.formatMoney(expTotal, cur)}</div></div></div>
          <div class="stat-card"><div class="stat-icon purple"><i data-lucide="wallet"></i></div><div class="stat-body"><div class="stat-label">Net (est.)</div><div class="stat-value">${Utils.formatMoney(net, cur)}</div></div></div>
        </div>
      </div>
    `;
  });

  // Sales by method
  let methodHtml = '';
  CURRENCIES.forEach(cur => {
    const curSales = sales.filter(s => s.currency === cur);
    if (curSales.length === 0) return;
    const byMethod = Utils.groupBy(curSales, s => s.paymentMethod);
    methodHtml += `<div class="card" style="margin-bottom:16px;"><div class="card-title">${t('reports.byMethod')} — ${cur}</div><div class="table-wrap"><table><thead><tr><th>${t('payments.method')}</th><th>${t('common.total')}</th><th>#</th></tr></thead><tbody>`;
    Object.entries(byMethod).forEach(([m, arr]) => {
      const sum = Utils.sum(arr.map(s => s.total));
      methodHtml += `<tr><td>${formatMethodName(m)}</td><td><strong>${Utils.formatMoney(sum, cur)}</strong></td><td>${arr.length}</td></tr>`;
    });
    methodHtml += '</tbody></table></div></div>';
  });

  // Product performance
  const perf = {};
  sales.forEach(s => s.items.forEach(it => {
    if (!perf[it.productId]) perf[it.productId] = { name: it.name, qty: 0, revenue: {} };
    perf[it.productId].qty += it.qty;
    perf[it.productId].revenue[s.currency] = (perf[it.productId].revenue[s.currency] || 0) + it.price * it.qty;
  }));
  const perfList = Object.values(perf).sort((a, b) => b.qty - a.qty);
  let perfHtml = `<div class="card" style="margin-bottom:16px;"><div class="card-title">${t('reports.productPerf')}</div>`;
  if (perfList.length === 0) perfHtml += `<div class="empty-state"><p>${t('common.noData')}</p></div>`;
  else {
    perfHtml += `<div class="table-wrap"><table><thead><tr><th>Product</th><th>Qty Sold</th><th>Revenue</th></tr></thead><tbody>`;
    perfList.forEach(p => {
      const revStr = Object.entries(p.revenue).map(([c, v]) => Utils.formatMoney(v, c)).join(' · ');
      perfHtml += `<tr><td>${Utils.escapeHtml(p.name)}</td><td><strong>${p.qty}</strong></td><td>${revStr}</td></tr>`;
    });
    perfHtml += '</tbody></table></div>';
  }
  perfHtml += '</div>';

  // Low stock
  const low = State.products.filter(p => p.stock <= (p.minStock || 10));
  let lowHtml = `<div class="card" style="margin-bottom:16px;"><div class="card-title">${t('reports.lowStock')}</div>`;
  if (low.length === 0) lowHtml += `<div class="empty-state"><p>All products are well stocked</p></div>`;
  else {
    lowHtml += `<div class="table-wrap"><table><thead><tr><th>${t('products.name')}</th><th>${t('products.stock')}</th><th>${t('products.minStock')}</th></tr></thead><tbody>`;
    low.forEach(p => { lowHtml += `<tr><td>${Utils.escapeHtml(p.name)}</td><td><strong>${p.stock}</strong></td><td>${p.minStock || 10}</td></tr>`; });
    lowHtml += '</tbody></table></div>';
  }
  lowHtml += '</div>';

  container.innerHTML = html + methodHtml + perfHtml + lowHtml;
  if (window.lucide) lucide.createIcons();
}

function exportSalesCSV() {
  if (State.sales.length === 0) { UI.toast(t('common.noData'), 'warn'); return; }
  let csv = 'Sale ID,Date,Currency,Subtotal,Discount,Total,Method,Amount Paid,Change,Customer\n';
  State.sales.forEach(s => {
    csv += `"${s.id}","${Utils.formatDateTime(s.createdAt)}","${s.currency}",${s.subtotal},${s.discount},${s.total},"${s.paymentMethod}",${s.amountPaid},${s.change},"${s.customerName || ''}"\n`;
  });
  const blob = new Blob([csv], { type: 'text/csv' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `sales-report-${new Date().toISOString().slice(0, 10)}.csv`;
  a.click();
  URL.revokeObjectURL(url);
  UI.toast('CSV exported', 'success');
}

          <p style="font-size:11px;color:var(--muted);margin-bottom:10px;">${t('settings.lastBackup')}: <strong id="last-backup">${Storage.getData(Storage.KEYS.lastBackup) ? Utils.formatDateTime(Storage.getData(Storage.KEYS.lastBackup)) : t('settings.never')}</strong></p>
          <button class="btn btn-primary btn-block" id="export-json" style="margin-bottom:8px;"><i data-lucide="download"></i>${t('settings.exportJson')}</button>
          <label class="btn btn-secondary btn-block" style="cursor:pointer;margin-bottom:8px;"><i data-lucide="upload"></i>${t('settings.importJson')}<input type="file" id="import-json" accept=".json" style="display:none;"></label>
          <div style="padding-top:12px;border-top:1px solid var(--border);margin-top:12px;">
            <p style="font-size:11px;color:var(--red);font-weight:600;margin-bottom:8px;">${t('settings.dangerZone')}</p>
            <button class="btn btn-danger btn-block" id="reset-data"><i data-lucide="rotate-ccw"></i>${t('btn.reset')}</button>
          </div>
        </div>
      </div>
    </div>
  `;

  document.getElementById('save-business').addEventListener('click', () => {
    State.settings.businessName = document.getElementById('set-bname').value.trim();
    State.settings.logo = document.getElementById('set-logo').value.trim();
    State.settings.region = document.getElementById('set-region').value;
    State.settings.defaultCurrency = document.getElementById('set-currency').value;
    State.settings.lowStockThreshold = parseInt(document.getElementById('set-lowstock').value, 10) || 10;
    State.settings.dateFormat = document.getElementById('set-datefmt').value;
    State.settings.receiptFooter = document.getElementById('set-footer').value.trim();
    persistState('settings');
    UI.toast(t('success.saved'), 'success');
  });

  document.getElementById('set-lang').addEventListener('change', (e) => {
    currentLang = e.target.value;
    document.documentElement.lang = currentLang;
    localStorage.setItem('kitchenware_lang', currentLang);
    State.settings.language = currentLang;
    persistState('settings');
    applyTranslations();
    document.getElementById('lang-select').value = currentLang;
    navigateTo('settings');
    if (window.lucide) lucide.createIcons();
  });

  document.getElementById('set-theme').addEventListener('click', () => {
    document.body.classList.toggle('dark');
    const isDark = document.body.classList.contains('dark');
    localStorage.setItem('kitchenware_theme', isDark ? 'dark' : 'light');
    State.settings.theme = isDark ? 'dark' : 'light';
    persistState('settings');
    updateThemeIcon();
    UI.toast(isDark ? 'Dark mode enabled' : 'Light mode enabled', 'success');
  });

  document.getElementById('export-json').addEventListener('click', () => {
    const backup = Storage.exportBackup();
    const blob = new Blob([JSON.stringify(backup, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `kitchenware-backup-${new Date().toISOString().slice(0, 10)}.json`;
    a.click();
    URL.revokeObjectURL(url);
    document.getElementById('last-backup').textContent = Utils.formatDateTime(Storage.getData(Storage.KEYS.lastBackup));
    UI.toast(t('success.backupExported'), 'success');
  });

  document.getElementById('import-json').addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (ev) => {
      try {
        const data = JSON.parse(ev.target.result);
        if (!Storage.validateBackup(data)) throw new Error('Invalid');
        UI.confirm(t('settings.importJson'), 'This will replace current data. Continue?', () => {
          Storage.importBackup(data);
          loadAllState();
          UI.toast(t('success.backupImported'), 'success');
          navigateTo('settings');
        });
      } catch (err) {
        UI.toast(t('errors.invalidFile'), 'error');
      }
    };
    reader.readAsText(file);
    e.target.value = '';
  });

  document.getElementById('reset-data').addEventListener('click', () => {
    UI.confirm(t('btn.reset'), t('settings.resetWarning'), () => {
      Object.values(Storage.KEYS).forEach(k => Storage.removeData(k));
      localStorage.removeItem('kitchenware_theme');
      localStorage.removeItem('kitchenware_lang');
      initializeDefaultData();
      loadAllState();
      UI.toast(t('success.reset'), 'success');
      navigateTo('dashboard');
    }, true);
  });

  if (window.lucide) lucide.createIcons();
}

/* ============================================================
   22. GLOBAL MODAL BACKDROP CLOSE
   ============================================================ */
document.getElementById('modal-backdrop').addEventListener('click', () => UI.closeModal());
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') {
    UI.closeModal();
    closeMobileDrawer();
  }
});</script>
</body>
</html>
